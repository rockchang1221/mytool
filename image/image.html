<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專屬新聞圖庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen p-6 sm:p-10 antialiased">

  <div class="max-w-6xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 pb-6 border-b border-zinc-200">
      <div>
        <h1 class="text-xl font-semibold tracking-tight text-zinc-900">專屬新聞圖庫</h1>
        <p id="count" class="text-xs text-zinc-500 mt-1">讀取中...</p>
      </div>
      <input 
        id="searchInput" 
        type="text" 
        placeholder="搜尋檔名關鍵字（例如：大跌、美股）..." 
        class="w-full sm:w-80 px-4 py-2 rounded-lg bg-white border border-zinc-200 text-zinc-900 placeholder-zinc-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-400 text-sm transition-all"
      >
    </div>

    <div id="status" class="text-zinc-400 text-sm text-center py-16">載入圖片中...</div>
    <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5"></div>
  </div>

  <script>
    const USERNAME = 'rockchang1221';
    const REPO_NAME = 'tools';
    const FOLDER = 'image/images';

    let allImages = [];

    async function loadImages() {
      const statusEl = document.getElementById('status');
      const countEl = document.getElementById('count');
      try {
        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO_NAME}/contents/${FOLDER}`);
        if (!res.ok) throw new Error('讀取失敗，請確認專案為 Public 且資料夾路徑正確');
        const files = await res.json();

        allImages = files.filter(f => /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name));
        countEl.textContent = `共 ${allImages.length} 張圖片`;

        if (allImages.length === 0) {
          statusEl.textContent = '資料夾裡還沒有圖片，快上傳幾張吧！';
          return;
        }

        statusEl.style.display = 'none';
        renderGallery(allImages);
      } catch (err) {
        countEl.textContent = '載入失敗';
        statusEl.textContent = '❌ ' + err.message;
      }
    }

    function renderGallery(images) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      images.forEach(file => {
        const pageUrl = new URL(`images/${encodeURIComponent(file.name)}`, window.location.href).href;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl overflow-hidden border border-zinc-200/80 shadow-sm hover:shadow-md transition-shadow flex flex-col';

        card.innerHTML = `
          <div class="aspect-video bg-zinc-100 overflow-hidden">
            <img src="${pageUrl}" alt="${file.name}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
          </div>
          <div class="p-3.5 flex flex-col gap-2.5 flex-1 justify-between">
            <p class="text-xs text-zinc-600 font-medium truncate" title="${file.name}">${file.name}</p>
            <button 
              onclick="copyLink(this, '${pageUrl}')" 
              class="w-full py-1.5 px-3 bg-zinc-900 hover:bg-zinc-700 active:scale-[0.98] text-white text-xs font-medium rounded-lg transition-all"
            >
              複製連結
            </button>
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    function copyLink(btn, url) {
      navigator.clipboard.writeText(url).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '已複製 ✓';
        btn.classList.replace('bg-zinc-900', 'bg-emerald-600');
        btn.classList.replace('hover:bg-zinc-700', 'hover:bg-emerald-600');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.replace('bg-emerald-600', 'bg-zinc-900');
          btn.classList.replace('hover:bg-emerald-600', 'hover:bg-zinc-700');
        }, 1200);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = allImages.filter(f => f.name.toLowerCase().includes(keyword));
      renderGallery(filtered);
    });

    loadImages();
  </script>
</body>
</html>
