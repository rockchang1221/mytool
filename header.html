<!-- =========================================================================
     共用頂部導覽列（header.html）
     未來要新增或修改導覽連結，只需編輯這個檔案即可同步套用到所有頁面！
     在下方 <nav class="nav-menu"> 內新增 <a href="./頁面檔名.html" class="nav-link">名稱</a>。
========================================================================= -->
<style>
  #site-header {
    position: sticky;
    top: 0;
    z-index: 40;
    min-height: 58px;
  }

  .topbar {
    height: 58px;
    padding: 0 24px;
    border-bottom: 1px solid #e4e4e7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: #ffffff;
    position: relative;
    z-index: 42;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex-shrink: 0;
  }

  .brand {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    color: #18181b;
  }

  .nav-menu {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    color: #18181b;
    background: transparent;
    text-decoration: none;
    white-space: nowrap;
    transition: background-color 0.18s ease, color 0.18s ease;
  }

  .nav-link:hover,
  .nav-link:focus-visible {
    background-color: rgba(0, 0, 0, 0.055);
    outline: none;
  }

  .nav-link:active {
    background-color: rgba(0, 0, 0, 0.09);
  }

  .nav-link.active {
    font-weight: 700;
  }

  /* Hamburger Button (Tesla-style minimal trigger, hidden on wide screens) */
  .nav-ham-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #18181b;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.18s ease;
  }

  .nav-ham-btn:hover,
  .nav-ham-btn:focus-visible {
    background-color: rgba(0, 0, 0, 0.055);
    outline: none;
  }

  .nav-ham-btn:active {
    background-color: rgba(0, 0, 0, 0.09);
  }

  .nav-ham-btn svg {
    width: 20px;
    height: 20px;
    display: block;
  }

  .nav-ham-btn .icon-close {
    display: none;
  }

  .topbar.menu-open .nav-ham-btn .icon-menu {
    display: none;
  }

  .topbar.menu-open .nav-ham-btn .icon-close {
    display: block;
  }

  .nav-backdrop {
    display: none;
    position: fixed;
    inset: 58px 0 0 0;
    background: rgba(24, 24, 27, 0.22);
    backdrop-filter: blur(2px);
    z-index: 39;
  }

  .nav-backdrop.open {
    display: block;
  }

  /* Compact / Mobile Hamburger Dropdown Mode (triggered by small screen OR nav overflow) */
  .topbar.is-compact .nav-ham-btn {
    display: inline-flex;
  }

  .topbar.is-compact .nav-menu {
    display: none;
    position: fixed;
    top: 58px;
    left: 0;
    right: 0;
    background: #ffffff;
    border-bottom: 1px solid #e4e4e7;
    box-shadow: 0 16px 36px rgba(24, 24, 27, 0.1);
    padding: 10px 16px 16px;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    z-index: 41;
    max-height: calc(100vh - 58px);
    overflow-y: auto;
  }

  .topbar.is-compact.menu-open .nav-menu {
    display: flex;
  }

  .topbar.is-compact .nav-link {
    justify-content: flex-start;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 8px;
  }

  .topbar.is-compact .nav-link.active {
    background-color: rgba(0, 0, 0, 0.045);
  }

  @media (max-width: 959px) {
    .topbar {
      padding: 0 14px;
    }
  }

  @media (max-width: 768px) {
    .nav-ham-btn {
      display: inline-flex;
    }

    .nav-menu {
      display: none;
      position: fixed;
      top: 58px;
      left: 0;
      right: 0;
      background: #ffffff;
      border-bottom: 1px solid #e4e4e7;
      box-shadow: 0 16px 36px rgba(24, 24, 27, 0.1);
      padding: 10px 16px 16px;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      z-index: 41;
      max-height: calc(100vh - 58px);
      overflow-y: auto;
    }

    .topbar.menu-open .nav-menu {
      display: flex;
    }

    .nav-link {
      justify-content: flex-start;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 8px;
    }

    .nav-link.active {
      background-color: rgba(0, 0, 0, 0.045);
    }
  }

  @media (max-width: 540px) {
    .brand {
      font-size: 15px;
    }
  }
</style>

<header class="topbar" id="siteTopbar">
  <div class="brand-group" id="siteBrandGroup">
    <div class="brand" id="siteHeaderBrand">工具箱</div>
  </div>
  <nav class="nav-menu" id="siteNavMenu" aria-label="頁面切換">
    <a href="./indexes.html" class="nav-link">圖卡產生器</a>
    <a href="./image.html" class="nav-link">新聞圖庫</a>
    <a href="./og.html" class="nav-link">網址摘要</a>
  </nav>
  <button
    type="button"
    class="nav-ham-btn"
    id="navHamBtn"
    aria-label="開啟導覽選單"
    aria-expanded="false"
    aria-controls="siteNavMenu"
  >
    <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7"></line>
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="17" x2="20" y2="17"></line>
    </svg>
    <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</header>
<div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>

<script>
  (function () {
    const topbar = document.getElementById('siteTopbar');
    const brandGroup = document.getElementById('siteBrandGroup');
    const navMenu = document.getElementById('siteNavMenu');
    const hamBtn = document.getElementById('navHamBtn');
    const backdrop = document.getElementById('navBackdrop');
    if (!topbar || !brandGroup || !navMenu || !hamBtn || !backdrop) return;

    function setMenuOpen(open) {
      topbar.classList.toggle('menu-open', open);
      backdrop.classList.toggle('open', open);
      hamBtn.setAttribute('aria-expanded', String(open));
      hamBtn.setAttribute('aria-label', open ? '關閉導覽選單' : '開啟導覽選單');
    }

    hamBtn.addEventListener('click', () => {
      setMenuOpen(!topbar.classList.contains('menu-open'));
    });

    backdrop.addEventListener('click', () => setMenuOpen(false));

    navMenu.querySelectorAll('.nav-link').forEach((link) => {
      link.addEventListener('click', () => setMenuOpen(false));
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setMenuOpen(false);
    });

    // Auto-switch to hamburger menu whenever screen <= 768px OR nav links would crowd the topbar
    let cachedNavWidth = 0;

    function updateResponsiveNav() {
      if (window.innerWidth <= 768) {
        topbar.classList.add('is-compact');
        return;
      }

      if (!topbar.classList.contains('is-compact')) {
        cachedNavWidth = navMenu.scrollWidth || cachedNavWidth;
      }

      const cs = window.getComputedStyle(topbar);
      const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      const available = topbar.clientWidth - padX - brandGroup.offsetWidth - 28;

      if (cachedNavWidth > 0 && available < cachedNavWidth) {
        topbar.classList.add('is-compact');
      } else {
        topbar.classList.remove('is-compact');
        setMenuOpen(false);
        cachedNavWidth = navMenu.scrollWidth || cachedNavWidth;
        if (cachedNavWidth > 0 && available < cachedNavWidth) {
          topbar.classList.add('is-compact');
        }
      }
    }

    updateResponsiveNav();
    window.addEventListener('resize', updateResponsiveNav);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateResponsiveNav);
    }
  })();
</script>
